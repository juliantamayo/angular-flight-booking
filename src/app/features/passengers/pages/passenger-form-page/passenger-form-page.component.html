<section class="passenger-page" aria-labelledby="passenger-page-title">
  <div class="passenger-page__heading">
    <app-booking-step-indicator />
    <h1 id="passenger-page-title">{{ i18n.translate(textKeys.passengers.page.title) }}</h1>
  </div>

  <form class="passenger-page__form" [formGroup]="form" (ngSubmit)="submitPassengers()">
    <section class="passenger-page__section" aria-labelledby="passenger-list-title">
      <div class="passenger-page__section-heading">
        <h2 id="passenger-list-title">
          {{ i18n.translate(textKeys.passengers.page.travelersTitle) }}
        </h2>
        <p>{{ i18n.translate(textKeys.passengers.page.travelersDescription) }}</p>
      </div>

      <div class="passenger-page__passenger-list" formArrayName="passengers">
        @for (passenger of passengers.controls; track $index; let index = $index) {
          <app-personal-information
            [expanded]="isPassengerExpanded(index)"
            [passengerGroup]="passenger"
            [title]="passengerTitle(index)"
            (expandedChange)="setPassengerExpanded(index, $event)"
            (nextClicked)="continueFromPassenger(index)"
          />
        }
      </div>
    </section>
    <div #bookingHolderSection class="passenger-page__booking-holder">
      <app-booking-holder [holderGroup]="form.controls.contact" />
    </div>
  </form>

  <ds-bottom-summary [config]="bottomSummaryConfig()" (actionClicked)="submitPassengers()" />
</section>
