<section class="booking-holder" aria-labelledby="booking-holder-title">
  <div class="booking-holder__heading">
    <h2 id="booking-holder-title">
      {{ i18n.translate(textKeys.passengers.bookingHolder.title) }}
    </h2>
    <p>{{ i18n.translate(textKeys.passengers.bookingHolder.description) }}</p>
  </div>

  <div class="booking-holder__grid" [formGroup]="holderGroup">
    <label class="booking-holder__field">
      <span>{{ i18n.translate(textKeys.passengers.bookingHolder.email) }}</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (hasError('email')) {
        <small>{{ i18n.translate(textKeys.passengers.bookingHolder.emailError) }}</small>
      }
    </label>

    <label class="booking-holder__field">
      <span>{{ i18n.translate(textKeys.passengers.bookingHolder.phone) }}</span>
      <input type="tel" formControlName="phone" autocomplete="tel" />
      @if (hasError('phone')) {
        <small>{{ i18n.translate(textKeys.passengers.bookingHolder.phoneError) }}</small>
      }
    </label>
  </div>
</section>
