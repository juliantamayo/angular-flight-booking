<section class="emergency-contact" aria-labelledby="emergency-contact-title">
  <div class="emergency-contact__heading">
    <h2 id="emergency-contact-title">Contacto de emergencia</h2>
    <p>Usaremos estos datos para enviar la confirmacion y cambios del viaje.</p>
  </div>

  <div class="emergency-contact__grid" [formGroup]="contactGroup">
    <label class="emergency-contact__field">
      <span>Correo electronico</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (hasError('email')) {
        <small>Ingresa un correo valido.</small>
      }
    </label>

    <label class="emergency-contact__field">
      <span>Telefono</span>
      <input type="tel" formControlName="phone" autocomplete="tel" />
      @if (hasError('phone')) {
        <small>Ingresa un telefono valido.</small>
      }
    </label>
  </div>
</section>
