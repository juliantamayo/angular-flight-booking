<section class="recent-searches" aria-labelledby="recent-searches-title">
  <div class="recent-searches__heading">
    <h2 id="recent-searches-title">{{ i18n.translate(textKeys.search.recentSearchesTitle) }}</h2>
  </div>

  <div class="recent-searches__list">
    @for (
      search of searches;
      track search.origin + search.destination + search.departureDate + search.returnDate
    ) {
      <article class="recent-searches__card">
        <button
          class="recent-searches__action"
          type="button"
          [attr.aria-label]="selectSearchAriaLabel(search)"
          (click)="selectSearch(search)"
        >
          <span class="recent-searches__info">
            <strong>
              {{ search.origin }}
              {{ i18n.translate(textKeys.search.recentSearchesRouteConnector) }}
              {{ search.destination }}
            </strong>
            <span>{{ dateSummary(search) }}</span>
            <span>{{ passengerSummary(search) }}</span>
          </span>
        </button>

        <button
          class="recent-searches__remove"
          type="button"
          [attr.aria-label]="removeSearchAriaLabel(search)"
          (click)="removeSearch(search)"
        >
          x
        </button>
      </article>
    }
  </div>
</section>
