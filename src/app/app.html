<a class="app-shell__skip-link" href="#main-content">{{
  i18n.translate(textKeys.app.skipToContent)
}}</a>

<header class="app-shell__header">
  <a
    class="app-shell__brand"
    routerLink="/"
    [attr.aria-label]="i18n.translate(textKeys.app.brandAria)"
  >
    <span class="app-shell__brand-mark" aria-hidden="true">SB</span>
    <span>SkyBooking</span>
  </a>
  <div
    class="app-shell__header-actions"
    [attr.aria-label]="i18n.translate(textKeys.app.headerControls)"
  >
    <p>{{ i18n.translate(textKeys.app.step) }}</p>
    <a routerLink="/">{{ i18n.translate(textKeys.app.help) }}</a>
    <div
      class="app-shell__language-switcher"
      [attr.aria-label]="i18n.translate(textKeys.app.languageSelector)"
    >
      <button
        class="app-shell__language-button"
        type="button"
        [attr.aria-label]="i18n.translate(textKeys.app.languageSpanish)"
        [class.app-shell__language-button--active]="i18n.currentLanguage() === 'es'"
        (click)="i18n.setLanguage('es')"
      >
        ES
      </button>
      <button
        class="app-shell__language-button"
        type="button"
        [attr.aria-label]="i18n.translate(textKeys.app.languageEnglish)"
        [class.app-shell__language-button--active]="i18n.currentLanguage() === 'en'"
        (click)="i18n.setLanguage('en')"
      >
        EN
      </button>
    </div>
  </div>
</header>

<main id="main-content" class="app-shell__main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-shell__footer">
  <p>{{ i18n.translate(textKeys.app.footerDisclaimer) }}</p>
</footer>
